# Ghostfolio backbone — dashboard, lot store, Postgres, Redis.
# The alert engine runs on the host (not in a container) and hits Ghostfolio's
# REST API at http://localhost:3333.

services:
  ghostfolio:
    image: ghostfolio/ghostfolio:latest
    container_name: portfolio-monitor-ghostfolio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ACCESS_TOKEN_SALT: ${ACCESS_TOKEN_SALT}
      # sslmode=disable is correct here — Postgres is on a private Docker network,
      # not exposed to the host. The default postgres:15-alpine image has no SSL
      # configured, and the @prisma/adapter-pg driver errors on sslmode=prefer
      # (P1011 TlsConnectionError) instead of falling back. Plain TCP is fine.
      DATABASE_URL: postgresql://ghostfolio:${POSTGRES_PASSWORD}@postgres:5432/ghostfolio?connect_timeout=300&sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      POSTGRES_DB: ghostfolio
      POSTGRES_USER: ghostfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:3333:3333"   # bind to localhost only — never exposed externally
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3333/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: portfolio-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghostfolio
      POSTGRES_USER: ghostfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ghostfolio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostfolio -d ghostfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s   # give Postgres time to do first-init before health checks count

  redis:
    image: redis:7-alpine
    container_name: portfolio-monitor-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ghostfolio-redisdata:/data

volumes:
  ghostfolio-pgdata:
  ghostfolio-redisdata:
