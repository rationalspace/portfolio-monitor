# tiers.example.yaml — Template for tiers.yaml
# Copy to tiers.yaml and populate with your own tickers.
# tiers.yaml is kept local (not committed).

tier_1:  # Blue-chip compounders — protect, no sell alerts, concentration watch only
  - TICKER1
  - TICKER2

tier_2:  # High-octane growth — protect with light watch, fundamentals-break only
  - TICKER3
  - TICKER4

tier_3:  # Specialized / rebound — active weakness watch
  - TICKER5

tier_4:  # Speculative growth — tighter weakness watch
  - TICKER6

exit_pool:  # Sell-into-strength + exit hunting on any rally
  - TICKER7

crypto_exposure:  # Sell-into-strength only; fundamentals rules disabled
  - TICKER8

watchlist:  # Buy-the-dip candidates — alerts when quality names pull back
  - symbol: TICKER9
    tier_when_acquired: tier_1
  - symbol: TICKER10
    tier_when_acquired: tier_2

index_fund:  # Excluded from all single-name rules; counted in total-portfolio math
  - TICKER11

# Per-ticker overrides — override default rule behaviour for specific symbols
overrides: {}
  # TICKER1:
  #   concentration_exempt: true
  # TICKER2:
  #   alert_cooldown_days: 14
